services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      NODE_ENV: production
    volumes:
      - mal-data:/app/data
    expose:
      - "3001"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/oracle/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web

volumes:
  mal-data:
  caddy-data:
  caddy-config:

networks:
  web: